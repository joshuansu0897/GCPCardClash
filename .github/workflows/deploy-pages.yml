# Builds the static site and publishes it to GitHub Pages on every push to master.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions" (see docs/DEPLOYMENT.md).
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# WHY: never cancel a deploy halfway through, but let a newer push queue behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npm test

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      # WHY: a project site is served from /<repo>/, so every asset URL needs that prefix.
      - name: Build the static site
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
